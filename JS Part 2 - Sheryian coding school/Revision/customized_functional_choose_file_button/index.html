<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload file</title>
    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: Arial, sans-serif;
          color: #fff
        }
        
        html,
        body {
          width: 100%;
          height: 100%;
        }
        
        body {
          background-color: #111
        }
        .main{
            display: none;
        }

        .upload-btn{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .upload-btn button{
            background-color: rgb(4, 102, 69);
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 30px;
            font-weight: 500;
        }

        .upload-btn button:hover{
            background-color: rgb(11, 114, 80);
        }

    </style>
</head>
<body>
    <div class="main">
        <input type="file">
    </div>
    <div class="upload-btn">
        <button class="upload">Upload File</button>
    </div>
 
 
    <script src="script.js"></script>
</body>
</html>
