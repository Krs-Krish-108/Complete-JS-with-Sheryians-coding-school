<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: Arial, sans-serif;
          color: #fff
        }
        
        html,
        body {
          width: 100%;
          height: 100%;
          
        }
        
        body {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            background-color: #333
        }

        input{
            display: block;
            margin: 10px;
            color: black;
            padding: 3px;
        }

        textarea{
            display: block;
            margin: 10px;
            width: 172.4px;
        }
        
        #card_form{
            display: flex;
            border: 1.3px solid #555;
            margin: 10px;
            width: 210px;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
        }

        #profile img{
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="card_form">
        <form action="">
            <input type="text" placeholder="Profile Pic">
            <input type="text" placeholder="Name">
            <input type="text" placeholder="Occupation">
            <textarea placeholder="Description"></textarea>
            <input type="submit">
        </form>
    </div>

    <div id="main">
        <div id="profile"><img src="https://images.pexels.com/photos/25078941/pexels-photo-25078941.jpeg" alt=""></div>
    </div>
</body>
</html>
