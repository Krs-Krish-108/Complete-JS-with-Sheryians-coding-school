<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Download Progress</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
        }

        .container {
            width: 400px;
            padding: 30px;

            background-color: #1c1c1c;
            border-radius: 12px;

            text-align: center;
        }

        .container h1 {
            margin-bottom: 25px;
            font-size: 28px;
        }

        .file-name {
            margin-bottom: 20px;
            color: #aaa;
            font-size: 15px;
        }

        .progress-container {
            width: 100%;
            height: 20px;

            background-color: #333;
            border-radius: 20px;

            overflow: hidden;
        }
        .progress-bar {
            width: 0%;
            height: 100%;

            background-color: #fff;
            border-radius: 20px;

            transition: width 0.2s ease;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;

            margin-top: 10px;

            font-size: 14px;
            color: #aaa;
        }

        .percentage {
            color: #fff;
        }

        .status {
            margin-top: 25px;

            font-size: 16px;
            color: #aaa;
        }

        .download-btn {
            margin-top: 20px;

            padding: 10px 20px;

            border: none;
            border-radius: 6px;

            background-color: #fff;
            color: #111;

            font-size: 15px;
            cursor: pointer;
        }

        .download-btn:hover {
            background-color: #ddd;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Downloading...</h1>

        <div class="file-name">
            Downloading: K.B.P-file.zip
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="progress-info">
            <span id="progressText">0%</span>
            <span id="downloadSize"><span id="downloadedSize">0</span> MB / 100 MB</span>
        </div>

        <div class="status" id="status">
            Preparing download...
        </div>

        <button class="download-btn" id="downloadBtn">
            Start Download
        </button>

    </div>

    <script src="scrpt.js"></script>

</body>
</html>
