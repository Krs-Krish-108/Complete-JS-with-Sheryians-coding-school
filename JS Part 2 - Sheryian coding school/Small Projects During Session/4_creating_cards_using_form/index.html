<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: Arial, sans-serif;
          color: #111;
        }
        
        html,
        body {
          width: 100%;
          height: 100%;
          
        }
        
        body {
            background-color: #333;            
        }

        #card_form{
            display: block;
            border: 1.3px solid #555;
            /* margin: 10px; */
            width: 200px;
            height: 165px;
            padding: 10px;
            margin: 10px;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
        }

        .input{
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .input input, textarea{
            margin: 3px;
            flex: 1;
            padding: 2px;
            border: none;
            border-radius: 3px;
        }


        #submit{
            background-color: #555;
            border: none;
            margin: 3px;
        }
        
        .content{
            display: flex;
            flex-wrap: wrap;
            width: auto;
            min-height: 350px;
            margin: 10px;
            border: 1.5px solid #fff;
            border-radius: 5px;
            padding: 10px;
        }

        .card1{
            width: 150px;
            height: 200px;
            padding: 10px;
            margin: 5px;
            border: 1px solid #c5c4c4;
            border-radius: 10px;
            /* color: #fff; */

        }

        .upper-half{
            display: flex;
            justify-content: center;
            height: 50px;
            margin-bottom: 5px;
        }

        .profile{
            width: 50px;
            height: 50px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgb(255, 205, 253);
        }

        .profile img{
            width: 100%;
            height: 100%;
        }

        .hrl{
            /* color: #d0bfbf34; */
            border: 0.2px solid #d0bfbf34;
            width: 80%;
            justify-self: center;
        }

        .lower-half h4,h3,p{
            font-size: 11px;
            color: #fff;
        }

        .name{
            padding: 3px 0px;
            padding-bottom: 1px;
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        .occupation{
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-weight:100;
        }
        .description{
            padding: 7px 0px;
        }

        
    </style>
</head>
<body>
    <header>
        <div id="card_form">
            <form action="">
                <div class="input">
                    <input type="text" placeholder="Profile Pic">
                    <input type="text" placeholder="Name">
                    <input type="text" placeholder="Occupation">
                    <textarea placeholder="Description"></textarea>
                    <input id="submit" type="submit">
                </div>
            </form>
        </div>
        <div>
        </div>
    </header>
    <main>
        <div class="content">
            <div class="card1">
                <div class="upper-half">
                    <div class="profile">
                       <img src="https://images.pexels.com/photos/25078941/pexels-photo-25078941.jpeg" alt="">
                    </div>
                </div>
                <hr class="hrl">
                <div class="lower-half">
                    <h3 class="name">Himanshi Rai</h3>
                    <h4 class="occupation">Content creator</h4>
                    <p class="description">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Facere aut placeat iusto deleniti sapiente iste inventore magnam dolor</p>
                </div>
            </div>
        </div>
    </main>
    
<script src="script.js"></script>
    
</body>
</html>
