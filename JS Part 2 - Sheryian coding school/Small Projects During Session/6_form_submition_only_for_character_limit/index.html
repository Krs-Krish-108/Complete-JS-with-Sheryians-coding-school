<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Char Limit Submit</title>
    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: Arial, sans-serif;
          /* color: #fff */
        }

        html,
        body {
          width: 100%;
          height: 100%;
        }

        body {
            background-image: url('bg.jpg');
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            /* background-position: center; */
            /* background-repeat: no-repeat; */
        }

        .container{
            display:flex;
            justify-content: center;
            align-items: center;
            height: 300px;
            width: 300px;
            border: 1px solid #fff;
            border-radius: 7px;
            background-color: rgba(240, 255, 255, 0.252);
            backdrop-filter: blur(8px);  
        }
        .form-inp{
            position: relative;
        }
        #char-inp{
            width: 200px;
            padding: 4px;
        }
        #cl {
            position: absolute;
            right: 0;
            bottom: -18px;
            margin: 0;
            font-size: 10px;
            font-weight: normal;
        }

    </style>
</head>
<body>
    <div class="container">
        <form action="">
        <div class="form-inp">
            <input type="text" name="" id="char-inp">
            <h6 id="cl">Characters Left: <span>20</span>/20</h6>
        </div>
    </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
